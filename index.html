<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Arniston Match Day</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

h1 {
  text-align: center;
  margin: 10px 0 20px;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 20px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 18px;
  margin: 7px 0;
  border: none;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #20c76a;
  color: white;
}

.goal {
  background: #1683ff;
  color: white;
}

.oppgoal {
  background: #e53935;
  color: white;
}

.sub {
  background: #ff9800;
  color: white;
}

.pause {
  background: #555;
  color: white;
}

.undo {
  background: #777;
  color: white;
}

.end {
  background: #8e44ad;
  color: white;
}

.score {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin: 15px 0;
}

.clock {
  text-align: center;
  font-size: 30px;
  margin: 10px 0 20px;
}

.hidden {
  display: none;
}

.player-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.player-grid button {
  margin: 0;
  min-height: 65px;
  font-size: 18px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 1000;
}

.modal-box {
  background: white;
  color: #111;
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 18px;
  padding: 20px;
}

.modal-box h2 {
  text-align: center;
}

.cancel {
  background: #555;
  color: white;
}

.event {
  background: #222;
  border-radius: 8px;
  padding: 10px;
  margin: 6px 0;
}

.stats {
  background: #222;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
}

.stats-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #444;
}

.small {
  font-size: 14px;
  color: #bbb;
}
</style>
</head>

<body>

<div class="container">

  <!-- SETUP -->
  <div id="setup">

    <h1>⚽ Arniston Match Day</h1>

    <input
      id="opponentInput"
      type="text"
      placeholder="Opponent team"
      autocomplete="off"
    >

    <button class="start" onclick="startMatch()">
      ▶ START MATCH
    </button>

  </div>


  <!-- MATCH -->
  <div id="match" class="hidden">

    <h1 id="matchTitle">Arniston Rangers</h1>

    <div class="score">
      <span id="our">0</span>
      -
      <span id="opp">0</span>
    </div>

    <div class="clock" id="clock">
      00:00
    </div>

    <button class="goal" onclick="ourGoal()">
      ⚽ OUR GOAL
    </button>

    <button class="oppgoal" onclick="opponentGoal()">
      🔴 OPPOSITION GOAL
    </button>

    <button class="sub" onclick="substitution()">
      🔄 SUBSTITUTION
    </button>

    <button class="pause" onclick="toggleClock()" id="pauseButton">
      ⏸ PAUSE CLOCK
    </button>

    <button class="undo" onclick="undoLast()">
      ↩ UNDO LAST EVENT
    </button>

    <button class="end" onclick="fullTime()">
      🏁 FULL TIME
    </button>

    <div class="stats">
      <h2>Match Events</h2>
      <div id="events"></div>
    </div>

  </div>

</div>


<!-- PLAYER MODAL -->

<div id="modal" class="modal hidden">

  <div class="modal-box">

    <h2 id="modalTitle">
      Choose Player
    </h2>

    <div id="playerButtons" class="player-grid"></div>

    <button class="cancel" onclick="closeModal()">
      CANCEL
    </button>

  </div>

</div>


<script>

const players = [
  "Finley",
  "Kai",
  "Matthew",
  "Fyfe",
  "Jax",
  "Leo",
  "Aahill",
  "William",
  "Aiden"
];


let opponent = "";

let ourScore = 0;
let oppScore = 0;

let matchSeconds = 0;

let clockRunning = false;
let clockInterval = null;

let events = [];

let stats = {};

let modalCallback = null;


/* =========================
   START MATCH
========================= */

function startMatch(){

  opponent =
    document.getElementById("opponentInput").value.trim();

  if(!opponent){

    alert("Enter the opponent team.");

    return;
  }

  players.forEach(player => {

    stats[player] = {
      goals: 0,
      assists: 0,
      minutes: 0,
      appearances: 0,
      onPitch: true,
      lastSubTime: 0
    };

  });

  document.getElementById("setup").classList.add("hidden");

  document.getElementById("match").classList.remove("hidden");

  document.getElementById("matchTitle").textContent =
    "Arniston Rangers vs " + opponent;

  startClock();

}


/* =========================
   CLOCK
========================= */

function startClock(){

  if(clockRunning) return;

  clockRunning = true;

  clockInterval = setInterval(() => {

    matchSeconds++;

    updateClock();

  },1000);

}


function pauseClock(){

  clockRunning = false;

  clearInterval(clockInterval);

}


function toggleClock(){

  if(clockRunning){

    pauseClock();

    document.getElementById("pauseButton").textContent =
      "▶ RESUME CLOCK";

  }else{

    startClock();

    document.getElementById("pauseButton").textContent =
      "⏸ PAUSE CLOCK";

  }

}


function updateClock(){

  let minutes =
    Math.floor(matchSeconds / 60);

  let seconds =
    matchSeconds % 60;

  document.getElementById("clock").textContent =
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");

}


function getTime(){

  let minutes =
    Math.floor(matchSeconds / 60);

  let seconds =
    matchSeconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0")
  );

}


/* =========================
   MODAL
========================= */

function choosePlayer(title, callback){

  document.getElementById("modalTitle").textContent =
    title;

  let container =
    document.getElementById("playerButtons");

  container.innerHTML = "";

  players.forEach(player => {

    let button =
      document.createElement("button");

    button.textContent = player;

    button.onclick = () => {

      closeModal();

      callback(player);

    };

    container.appendChild(button);

  });

  document
    .getElementById("modal")
    .classList.remove("hidden");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");

}


/* =========================
   OUR GOAL
========================= */

function ourGoal(){

  choosePlayer(
    "⚽ WHO SCORED?",
    function(scorer){

      chooseAssist(scorer);

    }
  );

}


function chooseAssist(scorer){

  document.getElementById("modalTitle").textContent =
    "🎯 ASSIST?";

  let container =
    document.getElementById("playerButtons");

  container.innerHTML = "";

  let noAssist =
    document.createElement("button");

  noAssist.textContent =
    "NO ASSIST";

  noAssist.onclick = () => {

    closeModal();

    recordGoal(
      scorer,
      "NONE"
    );

  };

  container.appendChild(noAssist);


  players.forEach(player => {

    if(player === scorer) return;

    let button =
      document.createElement("button");

    button.textContent = player;

    button.onclick = () => {

      closeModal();

      recordGoal(
        scorer,
        player
      );

    };

    container.appendChild(button);

  });

}


function recordGoal(scorer, assist){

  ourScore++;

  document.getElementById("our").textContent =
    ourScore;

  stats[scorer].goals++;

  if(
    assist !== "NONE"
  ){

    stats[assist].assists++;

  }

  events.push({

    type: "goal",

    scorer: scorer,

    assist: assist,

    time: getTime(),

    ourScore: ourScore,

    oppScore: oppScore

  });

  renderEvents();

}


/* =========================
   OPPOSITION GOAL
========================= */

function opponentGoal(){

  oppScore++;

  document.getElementById("opp").textContent =
    oppScore;

  events.push({

    type: "opponentGoal",

    time: getTime(),

    ourScore: ourScore,

    oppScore: oppScore

  });

  renderEvents();

}


/* =========================
   SUBSTITUTION
========================= */

function substitution(){

  choosePlayer(
    "🔄 WHO IS COMING OFF?",
    function(offPlayer){

      if(!stats[offPlayer].onPitch){

        alert(offPlayer + " is already off.");

        return;

      }

      choosePlayer(
        "🟢 WHO IS COMING ON?",
        function(onPlayer){

          if(onPlayer === offPlayer){

            alert("Choose a different player.");

            return;

          }

          if(stats[onPlayer].onPitch){

            alert(onPlayer + " is already on.");

            return;

          }

          stats[offPlayer].onPitch = false;

          stats[onPlayer].onPitch = true;

          events.push({

            type: "sub",

            off: offPlayer,

            on: onPlayer,

            time: getTime()

          });

          renderEvents();

        }
      );

    }
  );

}


/* =========================
   UNDO
========================= */

function undoLast(){

  if(events.length === 0){

    alert("Nothing to undo.");

    return;

  }

  let event =
    events.pop();

  if(event.type === "goal"){

    ourScore--;

    stats[event.scorer].goals--;

    if(event.assist !== "NONE"){

      stats[event.assist].assists--;

    }

  }

  if(event.type === "opponentGoal"){

    oppScore--;

  }

  if(event.type === "sub"){

    stats[event.off].onPitch = true;

    stats[event.on].onPitch = false;

  }

  document.getElementById("our").textContent =
    ourScore;

  document.getElementById("opp").textContent =
    oppScore;

  renderEvents();

}


/* =========================
   EVENTS
========================= */

function renderEvents(){

  let container =
    document.getElementById("events");

  container.innerHTML = "";

  events.forEach(event => {

    let div =
      document.createElement("div");

    div.className = "event";

    if(event.type === "goal"){

      div.textContent =
        "⚽ " +
        event.time +
        " — " +
        event.scorer +
        (
          event.assist !== "NONE"
          ? " (assist: " + event.assist + ")"
          : ""
        );

    }

    if(event.type === "opponentGoal"){

      div.textContent =
        "🔴 " +
        event.time +
        " — Opposition goal";

    }

    if(event.type === "sub"){

      div.textContent =
        "🔄 " +
        event.time +
        " — " +
        event.off +
        " OFF / " +
        event.on +
        " ON";

    }

    container.appendChild(div);

  });

}


/* =========================
   FULL TIME
========================= */

function fullTime(){

  pauseClock();

  calculateMinutes();

  let message =
    "FULL TIME\n\n" +
    "Arniston Rangers " +
    ourScore +
    " - " +
    oppScore +
    " " +
    opponent;

  alert(message);

  renderFinalStats();

}


function calculateMinutes(){

  let totalMinutes =
    matchSeconds / 60;

  players.forEach(player => {

    if(stats[player].onPitch){

      stats[player].minutes =
        Math.round(totalMinutes);

    }

  });

}


function renderFinalStats(){

  let container =
    document.getElementById("events");

  let html =
    "<h2>Player Stats</h2>";

  players.forEach(player => {

    html +=
      "<div class='stats-row'>" +
      "<span>" + player + "</span>" +
      "<span>" +
      stats[player].goals +
      "G " +
      stats[player].assists +
      "A " +
      stats[player].minutes +
      "m" +
      "</span>" +
      "</div>";

  });

  container.innerHTML += html;

}

</script>

</body>
</html>
