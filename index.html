<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchDay</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f4f6;
color:#111827
}
.app{
max-width:520px;
margin:auto;
padding:25px 16px 40px
}
h1{text-align:center;font-size:36px;margin:5px}
.subtitle{text-align:center;color:#6b7280;margin-bottom:25px}
.card{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:15px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}
button{
width:100%;
border:0;
border-radius:14px;
padding:16px;
margin-top:10px;
font-size:17px;
font-weight:bold;
background:#111827;
color:white
}
.secondary{background:#e5e7eb!important;color:#111827}
.green{background:#15803d}
.blue{background:#2563eb}
.red{background:#b91c1c}
input{
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:17px;
margin-top:8px
}
.hidden{display:none}
.score{text-align:center;font-size:58px;font-weight:bold}
.timer{text-align:center;font-size:25px;margin-bottom:15px}
.player{
display:flex;
justify-content:space-between;
padding:13px 0;
border-bottom:1px solid #eee
}
.event{
padding:11px;
background:#f3f4f6;
border-radius:10px;
margin-top:7px
}
</style>
</head>

<body>

<div class="app">

<h1>MatchDay ⚽</h1>
<div class="subtitle">Arniston Rangers U9 / U10</div>

<div id="home">

<div class="card">

<button onclick="newMatch()">➕ NEW MATCH</button>

<button class="secondary" onclick="showStats()">
📊 SEASON STATS
</button>

<button class="secondary" onclick="showHistory()">
📅 MATCH HISTORY
</button>

</div>
</div>


<div id="new" class="hidden">

<div class="card">

<h2>New Match</h2>

<label>Opponent</label>
<input id="opponent" placeholder="Enter opponent">

<h3>Players Available</h3>

<div id="players"></div>

<button onclick="startMatch()">START MATCH</button>

<button class="secondary" onclick="home()">BACK</button>

</div>
</div>


<div id="match" class="hidden">

<div class="card">

<h2 id="title" style="text-align:center"></h2>

<div class="score">
<span id="our">0</span>
-
<span id="opp">0</span>
</div>

<div class="timer" id="timer">00:00</div>

<button class="green" onclick="goal()">⚽ GOAL</button>

<button class="blue" onclick="substitution()">🔄 SUBSTITUTION</button>

<h3>Match Events</h3>

<div id="events"></div>

<button class="red" onclick="fullTime()">🏁 FULL TIME</button>

</div>
</div>


<div id="stats" class="hidden">

<div class="card">

<h2>Season Stats</h2>

<div id="statsList"></div>

<button class="secondary" onclick="home()">BACK</button>

</div>
</div>


<div id="history" class="hidden">

<div class="card">

<h2>Match History</h2>

<div id="historyList"></div>

<button class="secondary" onclick="home()">BACK</button>

</div>
</div>

</div>


<script>

const players=[
"Finley",
"William",
"Jax",
"Aahill",
"Aiden",
"Matthew",
"Leo",
"Kai",
"Fyfe"
];

let available=[];
let opponent="";
let ourScore=0;
let oppScore=0;
let events=[];
let startTime;
let timerInterval;

let stats=
JSON.parse(localStorage.getItem("matchdayStats")||"{}");

let history=
JSON.parse(localStorage.getItem("matchdayHistory")||"[]");


function hideAll(){
document.getElementById("home").classList.add("hidden");
document.getElementById("new").classList.add("hidden");
document.getElementById("match").classList.add("hidden");
document.getElementById("stats").classList.add("hidden");
document.getElementById("history").classList.add("hidden");
}


function home(){
hideAll();
document.getElementById("home").classList.remove("hidden");
}


function newMatch(){

hideAll();

document.getElementById("new").classList.remove("hidden");

document.getElementById("players").innerHTML=

players.map((p,i)=>`

<div class="player">

<label>

<input
type="checkbox"
id="p${i}"
checked
style="width:auto"
>

${p}

</label>

</div>

`).join("");

}


function startMatch(){

opponent=
document.getElementById("opponent").value.trim();

if(!opponent){
alert("Please enter the opponent.");
return;
}

available=[];

players.forEach((p,i)=>{

if(document.getElementById("p"+i).checked){
available.push(p);
}

});

ourScore=0;
oppScore=0;
events=[];

document.getElementById("our").textContent=0;
document.getElementById("opp").textContent=0;

document.getElementById("title").textContent=
"Arniston Rangers vs "+opponent;

document.getElementById("events").innerHTML="";

startTime=Date.now();

clearInterval(timerInterval);

timerInterval=setInterval(updateTimer,1000);

hideAll();

document.getElementById("match").classList.remove("hidden");

}


function updateTimer(){

let seconds=
Math.floor((Date.now()-startTime)/1000);

let mins=Math.floor(seconds/60);

let secs=seconds%60;

document.getElementById("timer").textContent=

String(mins).padStart(2,"0")
+
":"
+
String(secs).padStart(2,"0");

}


function goal(){

let choice=
prompt(
"Who scored?\n\n"+
"Type ARNISTON or OPPONENT"
);

if(!choice)return;

choice=choice.toLowerCase();


if(choice==="opponent"){

oppScore++;

document.getElementById("opp").textContent=oppScore;

events.push({
type:"opponentGoal"
});

renderEvents();

return;

}


if(choice==="arniston"){

let scorer=
prompt(
"Who scored?\n\n"+
available.join("\n")
);

if(!scorer)return;

if(!available.includes(scorer)){

alert("Player name not recognised.");

return;

}


let assist=
prompt(
"Assist? Type NONE if there wasn't one.\n\n"+
available.join("\n")
);

if(!assist)assist="NONE";

ourScore++;

document.getElementById("our").textContent=ourScore;


events.push({
type:"goal",
scorer:scorer,
assist:assist
});


if(!stats[scorer]){
stats[scorer]={
goals:0,
assists:0,
minutes:0,
appearances:0
};
}

stats[scorer].goals++;


if(
assist!=="NONE" &&
available.includes(assist)
){

if(!stats[assist]){
stats[assist]={
goals:0,
assists:0,
minutes:0,
appearances:0
};
}

stats[assist].assists++;

}

renderEvents();

}

}


function substitution(){

if(available.length===0)return;

let off=
prompt(
"Who is coming OFF?\n\n"+
available.join("\n")
);

if(!off)return;

if(!available.includes(off)){

alert("Player not found.");

return;

}


let bench=
players.filter(p=>!available.includes(p));

if(bench.length===0){

alert("Everyone is already on the pitch.");

return;

}


let on=
prompt(
"Who is coming ON?\n\n"+
bench.join("\n")
);

if(!on)return;

if(!bench.includes(on)){

alert("Player not found.");

return;

}


available=
available.filter(p=>p!==off);

available.push(on);

events.push({
type:"sub",
off:off,
on:on
});

renderEvents();

}


function renderEvents(){

let html="";

events.forEach(e=>{

if(e.type==="goal"){

html+=`

<div class="event">
⚽ <strong>${e.scorer}</strong>
${e.assist!=="NONE"
?" — 🎯 "+e.assist:""}
</div>

`;

}

if(e.type==="opponentGoal"){

html+=`

<div class="event">
🔴 Opponent goal
</div>

`;

}

if(e.type==="sub"){

html+=`

<div class="event">
🔄 ${e.off} ➡️ ${e.on}
</div>

`;

}

});

document.getElementById("events").innerHTML=html;

}


function fullTime(){

clearInterval(timerInterval);

let minutes=
Math.floor((Date.now()-startTime)/60000);


available.forEach(p=>{

if(!stats[p]){

stats[p]={
goals:0,
assists:0,
minutes:0,
appearances:0
};

}

stats[p].appearances++;

stats[p].minutes+=minutes;

});


history.unshift({

date:new Date().toLocaleDateString("en-GB"),

opponent:opponent,

score:ourScore+" - "+oppScore

});


localStorage.setItem(
"matchdayStats",
JSON.stringify(stats)
);

localStorage.setItem(
"matchdayHistory",
JSON.stringify(history)
);


alert(
"FULL TIME\n\n"+
"Arniston Rangers "+
ourScore+
" - "+
oppScore+
" "+
opponent
);

home();

}


function showStats(){

hideAll();

document.getElementById("stats").classList.remove("hidden");

let html="";

players.forEach(p=>{

let s=stats[p]||{
goals:0,
assists:0,
minutes:0,
appearances:0
};

html+=`

<div class="player">

<strong>${p}</strong>

<span>
${s.goals} ⚽
${s.assists} 🎯
${Math.round(s.minutes)} min
</span>

</div>

`;

});

document.getElementById("statsList").innerHTML=html;

}


function showHistory(){

hideAll();

document.getElementById("history").classList.remove("hidden");

if(history.length===0){

document.getElementById("historyList").innerHTML=
"<p>No matches yet.</p>";

return;

}

document.getElementById("historyList").innerHTML=

history.map(m=>`

<div class="event">

<strong>${m.score}</strong>

<br>

vs ${m.opponent}

<br>

<small>${m.date}</small>

</div>

`).join("");

}

</script>

</body>
</html>
