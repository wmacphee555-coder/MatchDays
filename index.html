<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchDay</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f4f7;
  color: #111827;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 25px 16px 40px;
}

h1 {
  text-align: center;
  font-size: 36px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 25px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  margin-top: 10px;
  font-size: 17px;
  font-weight: bold;
  background: #111827;
  color: white;
}

button.secondary {
  background: #e5e7eb;
  color: #111827;
}

button.goal {
  background: #15803d;
  font-size: 22px;
}

button.sub {
  background: #2563eb;
  font-size: 20px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 17px;
  margin-top: 8px;
}

.hidden {
  display: none;
}

.score {
  text-align: center;
  font-size: 58px;
  font-weight: bold;
}

.timer {
  text-align: center;
  font-size: 25px;
  margin-bottom: 15px;
  font-variant-numeric: tabular-nums;
}

.player {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.player button {
  width: auto;
  padding: 8px 12px;
  margin: 0;
  font-size: 14px;
}

.event {
  padding: 10px;
  background: #f3f4f6;
  border-radius: 10px;
  margin-top: 7px;
}

.back {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="app">

<h1>MatchDay ⚽</h1>
<div class="subtitle">Arniston Rangers U9 / U10</div>

<!-- HOME -->

<div id="home">

<div class="card">

<button onclick="showNewMatch()">+ NEW MATCH</button>

<button class="secondary" onclick="showStats()">
📊 SEASON STATS
</button>

<button class="secondary" onclick="showHistory()">
📅 MATCH HISTORY
</button>

</div>

</div>


<!-- NEW MATCH -->

<div id="newMatch" class="hidden">

<div class="card">

<h2>New Match</h2>

<label>Opponent</label>

<input id="opponent" placeholder="Enter opponent">

<h3>Players Available</h3>

<div id="playerList"></div>

<button onclick="startMatch()">
START MATCH
</button>

<button class="secondary" onclick="goHome()">
BACK
</button>

</div>

</div>


<!-- LIVE MATCH -->

<div id="liveMatch" class="hidden">

<div class="card">

<h2 id="matchTitle" style="text-align:center"></h2>

<div class="score">
<span id="homeScore">0</span>
-
<span id="awayScore">0</span>
</div>

<div class="timer" id="timer">
00:00
</div>

<button class="goal" onclick="recordGoal()">
⚽ GOAL
</button>

<button class="sub" onclick="makeSubstitution()">
🔄 SUBSTITUTION
</button>

<h3>Match Events</h3>

<div id="events"></div>

<button onclick="finishMatch()">
FULL TIME
</button>

</div>

</div>


<!-- STATS -->

<div id="stats" class="hidden">

<div class="card">

<h2>Season Stats</h2>

<div id="statsList"></div>

<button class="secondary" onclick="goHome()">
BACK
</button>

</div>

</div>


<!-- HISTORY -->

<div id="history" class="hidden">

<div class="card">

<h2>Match History</h2>

<div id="historyList"></div>

<button class="secondary" onclick="goHome()">
BACK
</button>

</div>

</div>

</div>


<script>

const players = [
"Harry",
"Jack",
"William",
"Kai",
"Findlay",
"Matthew",
"Fyfe",
"Adam",
"Elliot",
"Sonny"
];

let availablePlayers = [];

let opponent = "";

let homeScore = 0;

let awayScore = 0;

let matchEvents = [];

let matchStart;

let timerInterval;


let stats =
JSON.parse(localStorage.getItem("matchDayStats")) || {};

let history =
JSON.parse(localStorage.getItem("matchDayHistory")) || [];


function hideAll() {

document.getElementById("home").classList.add("hidden");

document.getElementById("newMatch").classList.add("hidden");

document.getElementById("liveMatch").classList.add("hidden");

document.getElementById("stats").classList.add("hidden");

document.getElementById("history").classList.add("hidden");

}


function goHome() {

hideAll();

document.getElementById("home").classList.remove("hidden");

}


function showNewMatch() {

hideAll();

document.getElementById("newMatch").classList.remove("hidden");

renderPlayers();

}


function renderPlayers() {

let list = "";

players.forEach((player, index) => {

list += `
<div class="player">

<label>

<input
type="checkbox"
id="player${index}"
checked
style="width:auto"
>

${player}

</label>

</div>
`;

});

document.getElementById("playerList").innerHTML = list;

}


function startMatch() {

opponent =
document.getElementById("opponent").value.trim();

if (!opponent) {

alert("Enter the opponent first.");

return;

}

availablePlayers = [];

players.forEach((player, index) => {

if (
document.getElementById("player" + index).checked
) {

availablePlayers.push(player);

}

});


homeScore = 0;

awayScore = 0;

matchEvents = [];

document.getElementById("homeScore").textContent = "0";

document.getElementById("awayScore").textContent = "0";

document.getElementById("matchTitle").textContent =
"Arniston Rangers vs " + opponent;

document.getElementById("events").innerHTML = "";

matchStart = Date.now();

clearInterval(timerInterval);

timerInterval = setInterval(updateTimer,1000);

hideAll();

document.getElementById("liveMatch").classList.remove("hidden");

}


function updateTimer() {

let seconds =
Math.floor((Date.now() - matchStart) / 1000);

let minutes =
Math.floor(seconds / 60);

seconds =
seconds % 60;

document.getElementById("timer").textContent =
String(minutes).padStart(2,"0")
+
":"
+
String(seconds).padStart(2,"0");

}


function recordGoal() {

if (availablePlayers.length === 0) {

alert("No players selected.");

return;

}

let scorer =
prompt(
"Who scored?\n\n" +
availablePlayers.join("\n")
);

if (!scorer) return;

if (!availablePlayers.includes(scorer)) {

alert("Please enter a player exactly as shown.");

return;

}


let assist =
prompt(
"Assist from? Type None if there was no assist.\n\n" +
availablePlayers.join("\n")
);

if (!assist) assist = "None";


homeScore++;

document.getElementById("homeScore").textContent =
homeScore;


matchEvents.push({

type: "goal",

scorer: scorer,

assist: assist

});


if (!stats[scorer]) {

stats[scorer] = {
goals: 0,
assists: 0,
appearances: 0,
minutes: 0
};

}

stats[scorer].goals++;


if (
assist !== "None" &&
availablePlayers.includes(assist)
) {

if (!stats[assist]) {

stats[assist] = {
goals: 0,
assists: 0,
appearances: 0,
minutes: 0
};

}

stats[assist].assists++;

}


renderEvents();

}


function makeSubstitution() {

if (availablePlayers.length === 0) {

alert("No players available.");

return;

}

let off =
prompt(
"Who is coming OFF?\n\n" +
availablePlayers.join("\n")
);

if (!off) return;


if (!availablePlayers.includes(off)) {

alert("Player not found.");

return;

}


let bench =
players.filter(
player => !availablePlayers.includes(player)
);


if (bench.length === 0) {

alert("Everyone is already on the pitch.");

return;

}


let on =
prompt(
"Who is coming ON?\n\n" +
bench.join("\n")
);

if (!on) return;


if (!bench.includes(on)) {

alert("Player not found.");

return;

}


availablePlayers =
availablePlayers.filter(
player => player !== off
);

availablePlayers.push(on);


matchEvents.push({

type: "sub",

off: off,

on: on

});


renderEvents();

}


function renderEvents() {

let html = "";

matchEvents.forEach(event => {

if (event.type === "goal") {

html += `
<div class="event">
⚽ <strong>${event.scorer}</strong>
${event.assist !== "None"
? " — 🎯 " + event.assist
: ""}
</div>
`;

}

if (event.type === "sub") {

html += `
<div class="event">
🔄 ${event.off}
➡️
${event.on}
</div>
`;

}

});

document.getElementById("events").innerHTML = html;

}


function finishMatch() {

clearInterval(timerInterval);

let minutes =
Math.floor(
(Date.now() - matchStart) / 60000
);


availablePlayers.forEach(player => {

if (!stats[player]) {

stats[player] = {
goals: 0,
assists: 0,
appearances: 0,
minutes: 0
};

}

stats[player].appearances++;

stats[player].minutes += minutes;

});


history.unshift({

date: new Date().toLocaleDateString("en-GB"),

opponent: opponent,

score:
homeScore + " - " + awayScore

});


localStorage.setItem(
"matchDayStats",
JSON.stringify(stats)
);

localStorage.setItem(
"matchDayHistory",
JSON.stringify(history)
);


alert(
"Full time!\n\n" +
"Arniston Rangers " +
homeScore +
" - " +
awayScore +
" " +
opponent
);


goHome();

}


function showStats() {

hideAll();

document.getElementById("stats").classList.remove("hidden");

let html = "";

players.forEach(player => {

let s =
stats[player] || {
goals:0,
assists:0,
appearances:0,
minutes:0
};

html += `
<div class="player">

<strong>${player}</strong>

<span>
${s.goals} ⚽
&nbsp;
${s.assists} 🎯
&nbsp;
${s.minutes} min
</span>

</div>
`;

});

document.getElementById("statsList").innerHTML = html;

}


function showHistory() {

hideAll();

document.getElementById("history").classList.remove("hidden");

let html = "";

if (history.length === 0) {

html = "<p>No matches recorded yet.</p>";

} else {

history.forEach(match => {

html += `
<div class="event">

<strong>
${match.score}
</strong>

<br>

vs ${match.opponent}

<br>

<small>
${match.date}
</small>

</div>
`;

});

}

document.getElementById("historyList").innerHTML = html;

}

</script>

</body>
</html>
